name: Publish RouteShare Web

on:
  push:
    branches: [foundation]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Export Expo Web
        run: pnpm --filter @routeshare/mobile exec expo export --platform web --output-dir ../../dist
      - name: Adjust asset paths for project Pages URL
        run: sed -i 's|href="/|href="/Routeshare/|g; s|src="/|src="/Routeshare/|g' dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
