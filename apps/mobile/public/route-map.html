<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body, #map { margin: 0; width: 100%; height: 100%; background: #e6e9e9; }
    .leaflet-control-attribution { font-size: 9px !important; }
    .marker {
      background: #132235;
      color: white;
      border: 2px solid white;
      border-radius: 50%;
      padding: 0;
      font: 700 9px system-ui;
      white-space: nowrap;
      box-shadow: 0 1px 4px #3337;
    }
    .info {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 1000;
      background: #101d2be8;
      color: #fff;
      border-radius: 7px;
      padding: 6px 9px;
      font: 11px system-ui;
      max-width: 75%;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="info" id="info" role="status">Завантаження дорожніх маршрутів…</div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const info = document.getElementById('info');
    const neutral = '#171b23';
    const toLatLng = ([lon, lat]) => [lat, lon];

    function isPoint(value) {
      return Array.isArray(value) && value.length === 2 &&
        value.every(Number.isFinite) && Math.abs(value[0]) <= 180 && Math.abs(value[1]) <= 90;
    }

    async function fetchJson(url, signal) {
      const request = new AbortController();
      const cancel = () => request.abort();
      signal.addEventListener('abort', cancel, { once: true });
      if (signal.aborted) cancel();
      const timer = setTimeout(cancel, 10000);
      try {
        const response = await fetch(url, { signal: request.signal });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return await response.json();
      } finally {
        clearTimeout(timer);
        signal.removeEventListener('abort', cancel);
      }
    }

    async function resolveStop(stop, signal) {
      if (isPoint(stop)) return stop;
      if (typeof stop !== 'string' || !stop.trim() || stop === 'Моя GPS-точка') return null;

      const key = 'rs-geo-photon:' + stop.toLowerCase().trim();
      try {
        const cached = JSON.parse(localStorage.getItem(key) || 'null');
        if (isPoint(cached)) return cached;
      } catch {}

      const url = 'https://photon.komoot.io/api/?limit=6&lang=default&lat=50.45&lon=30.52&q=' + encodeURIComponent(stop);
      const { features = [] } = await fetchJson(url, signal);
      const match = features.find(feature =>
        feature.properties?.countrycode === 'UA' && isPoint(feature.geometry?.coordinates)
      );
      if (!match) return null;
      const point = match.geometry.coordinates;
      try { localStorage.setItem(key, JSON.stringify(point)); } catch {}
      return point;
    }

    async function roadGeometry(stops, signal) {
      const coordinates = stops.map(stop => stop.join(',')).join(';');
      const url = 'https://router.project-osrm.org/route/v1/driving/' + coordinates + '?overview=full&geometries=geojson';
      const data = await fetchJson(url, signal);
      const geometry = data.routes?.[0]?.geometry?.coordinates;
      if (data.code !== 'Ok' || !geometry?.length) throw new Error('Маршрут не знайдено');
      return geometry;
    }

    function markerLabel(kind, index, total) {
      if (kind === 'driver') return index === 0 ? 'А' : 'Б';
      const pickups = total / 2;
      return index < pickups ? '↑' + (index + 1) : '↓' + (index - pickups + 1);
    }

    function marker(point, label, color, compact = false) {
      const badge = document.createElement('span');
      badge.className = 'marker';
      badge.style.borderColor = color;
      if (compact) { badge.style.width = '8px'; badge.style.height = '8px'; badge.style.borderWidth = '1.5px'; badge.style.background = color; }
      else badge.textContent = label;
      return L.marker(toLatLng(point), {
        icon: L.divIcon({ className: '', html: badge, iconSize: compact ? [10, 10] : [22, 18] }),
      });
    }

    function initializeMap() {
      const map = L.map('map', { zoomControl: true }).setView([50.43, 30.55], 11);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors',
      }).addTo(map);
      const layers = L.featureGroup().addTo(map);
      let previousPayload;
      let renderController;

      function fitRoutes() {
        const bounds = layers.getBounds();
        if (bounds.isValid()) map.fitBounds(bounds, { padding: [22, 22], maxZoom: 16 });
      }

      async function drawRoutes(routes, signal) {
        if (!routes.length) {
          info.textContent = 'Немає маршрутів для відображення';
          return;
        }

        info.textContent = 'Завантаження дорожніх маршрутів…';
        let drawn = 0;
        let missing = 0;
        let unavailable = 0;
        let demoSchemes = 0;
        const demos = routes.filter(route => route.kind === 'demo').length;

        async function drawRoute(route, routeIndex) {
          const color = /^#[0-9a-f]{6}$/i.test(route.color) ? route.color : neutral;
          let stops;
          try {
            stops = await Promise.all(route.stops.map(stop => resolveStop(stop, signal)));
          } catch {
            if (!signal.aborted) unavailable++;
            return;
          }
          if (signal.aborted) return;
          if (stops.length < 2 || stops.some(stop => !stop)) {
            missing++;
            return;
          }

          const first = layers.getLayers().length === 0;
          const routeLayers = L.featureGroup().addTo(layers);
          // Overview: each passenger is a separate pickup-to-dropoff route.
          // Detail: preserve the complete ordered pickup/dropoff itinerary.
          const split = route.separate && stops.length >= 4 && stops.length % 2 === 0;
          const pairs = split ? Array.from({length:stops.length/2},(_,i)=>[stops[i],stops[i+stops.length/2]]) : [stops];
          if (route.kind === 'driver') {
            stops.forEach((point,index)=>marker(point,markerLabel(route.kind,index,stops.length),color,false).addTo(routeLayers));
          } else {
            const compact = route.separate;
            pairs.forEach(pair => {
              marker(pair[0], '', color, compact).addTo(routeLayers);
              marker(pair[pair.length-1], '', color, compact).addTo(routeLayers);
            });
          }
          if (first) fitRoutes();
          for (const pair of pairs) {
            try {
              const geometry = await roadGeometry(pair, signal);
              if (signal.aborted) return;
              const width = route.kind === 'driver' ? 5 : route.separate ? 2.5 : 4;
              const path = geometry.map(toLatLng);
              // Small lateral separation lets coincident colored routes remain visible.
              const shift = route.separate && color !== neutral ? ((routeIndex % 5) - 2) * 1.8 : 0;
              const shifted = shift ? path.map((point,i) => {
                const prev = map.project(path[Math.max(0,i-1)],map.getZoom());
                const next = map.project(path[Math.min(path.length-1,i+1)],map.getZoom());
                const dx=next.x-prev.x,dy=next.y-prev.y;
                const length=Math.hypot(dx,dy)||1;
                const pixel=map.project(point,map.getZoom());
                return map.unproject([pixel.x-dy/length*shift,pixel.y+dx/length*shift],map.getZoom());
              }) : path;
              L.polyline(shifted, { color: '#fff', weight: width+1, opacity: .68 }).addTo(routeLayers);
              L.polyline(shifted, { color, weight: width, opacity: .95 }).addTo(routeLayers);
              drawn++;
            } catch {
              if (signal.aborted) return;
              if (route.kind === 'demo') {
                L.polyline(pair.map(toLatLng), { color, weight: 2, dashArray: '6 5' }).addTo(routeLayers);
                demoSchemes++;
              } else unavailable++;
            }
          }
        }

        for (let offset = 0; offset < routes.length && !signal.aborted; offset += 3) {
          await Promise.all(routes.slice(offset, offset + 3).map((route,i)=>drawRoute(route,offset+i)));
        }
        if (signal.aborted) return;

        fitRoutes();
        const status = ['Дорожні маршрути: ' + drawn + '/' + routes.length];
        if (demos) status.push('Демо: ' + demos);
        if (demoSchemes) status.push('Демо-схеми: ' + demoSchemes);
        if (missing) status.push('Без координат: ' + missing);
        if (unavailable) status.push('Недоступні: ' + unavailable);
        info.textContent = status.join(' · ');
      }

      function render(payload) {
        if (payload === previousPayload) return;
        let routes;
        try { routes = JSON.parse(payload); } catch { return; }
        if (!Array.isArray(routes)) return;

        previousPayload = payload;
        renderController?.abort();
        renderController = new AbortController();
        layers.clearLayers();
        void drawRoutes(routes, renderController.signal);
      }

      window.addEventListener('message', event => {
        if (event.source === window.parent && event.origin === window.location.origin &&
            event.data?.type === 'routeshare:routes' && typeof event.data.payload === 'string') {
          render(event.data.payload);
        }
      });

      // Accept the request payload from web builds that still load the previous map URL.
      const legacy = new URLSearchParams(window.location.search).get('requests');
      if (legacy) {
        try {
          const routes = JSON.parse(legacy).map(request => ({
            stops: [request.origin, request.destination], color: neutral, kind: 'passenger',
          }));
          render(JSON.stringify(routes));
        } catch {}
      } else if (window.parent === window) {
        render('[]');
      }
    }

    if (window.L) initializeMap();
    else info.textContent = 'Карта тимчасово недоступна';
  </script>
</body>
</html>
