<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{margin:0;height:100%;background:#152936}#pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);z-index:500;font-size:36px;pointer-events:none;filter:drop-shadow(0 2px 3px #111)}#hint{position:absolute;top:12px;left:12px;right:12px;background:#172c3eea;color:white;z-index:500;padding:10px;border-radius:9px;font:14px sans-serif;text-align:center}</style></head><body><div id="map"></div><div id="pin">📍</div><div id="hint">Пересунь карту під маркером, потім підтвердь точку</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map').setView([50.4501,30.5234],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);const send=()=>{const c=map.getCenter();parent.postMessage({type:'routeshare-map-point',lat:c.lat,lon:c.lng},'*')};map.on('moveend',send);window.addEventListener('message',e=>{if(e.data?.type==='routeshare-map-center'&&Number.isFinite(e.data.lat)&&Number.isFinite(e.data.lon))map.setView([e.data.lat,e.data.lon],16)});send();</script></body></html>
